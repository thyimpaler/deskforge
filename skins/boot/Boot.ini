; deskforge boot and wake reveal: plays once (about 3 s), then removes itself.
; Activated by the startup check after sign-in, and by dock.exe after an unlock or resume,
; only when desk.json has wakeReveal.enabled = true. The big line is wakeReveal.text.
; Cover -> status lines one by one -> cover wipes away -> the panel intro replays.
; Image and String meters only (no Shape meters, no fades). The last step always deactivates the skin,
; so it can never stay on screen. Click-through while it plays.

[Rainmeter]
Update=-1
AccurateText=1
OnRefreshAction=[!FadeDuration 0][!ZPos 2][!ClickThrough 1][!Draggable 0][!KeepOnScreen 0][!Move 0 0][!CommandMeasure mSeq "Execute 1"]

[Metadata]
Name=deskforge Boot
Author=deskforge contributors
License=MIT

[Variables]
@Include=#@#theme.inc
@Include2=#@#desk.inc
BTime=--:--
BNet=UNKNOWN
BWid=-/-
BDock=UNKNOWN
PW=1
CH=#SCREENAREAHEIGHT#
Mx=(#SCREENAREAWIDTH#*0.106)
TrackW=(#SCREENAREAWIDTH#-2*#Mx#)
@Include3=#@#bootseq.inc

[mSeq]
Measure=Plugin
Plugin=ActionTimer
DynamicVariables=1
ActionList1=Wait 300 | S1 | Wait 210 | S2 | Wait 210 | S3 | Wait 210 | S4 | Wait 210 | S5 | Wait 700 | Clear | Wait 40 | Repeat Wipe, 25, 10 | Wait 40 | Done
S1=[!ShowMeterGroup L1][!SetVariable PW "(#TrackW#*0.2)"][!UpdateMeter Prog][!Redraw]
S2=[!ShowMeterGroup L2][!SetVariable PW "(#TrackW#*0.4)"][!UpdateMeter Prog][!Redraw]
S3=[!ShowMeterGroup L3][!SetVariable PW "(#TrackW#*0.6)"][!UpdateMeter Prog][!Redraw]
S4=[!ShowMeterGroup L4][!SetVariable PW "(#TrackW#*0.8)"][!UpdateMeter Prog][!Redraw]
S5=[!ShowMeterGroup L5][!SetVariable PW "(#TrackW#)"][!UpdateMeter Prog][!Redraw]
Clear=[!HideMeterGroup X][!Redraw][!CommandMeasure mIntro "Execute 1" "deskforge\Panel"]
Wipe=[!SetVariable CH "(Max([#CH]-(#SCREENAREAHEIGHT#/9),1))"][!UpdateMeter Cover][!Redraw]
Done=[!DeactivateConfig "deskforge\Boot"]

[Cover]
Meter=Image
DynamicVariables=1
SolidColor=#Surface#,255
X=0
Y=(#SCREENAREAHEIGHT#-#CH#)
W=#SCREENAREAWIDTH#
H=#CH#

[Tag]
Meter=String
Group=X
Text=DESK / BOOT  #BTime#
FontFace=#Mono#
FontSize=10
FontColor=#Accent#
AntiAlias=1
X=(#Mx#+4)
Y=262

[Mark]
Meter=String
Group=X
Text=#WakeText#
FontFace=#Display#
FontWeight=700
FontSize=72
FontColor=#Ink#
AntiAlias=1
X=(#Mx#-4)
Y=282

[Track]
Meter=Image
Group=X
SolidColor=#Rule#,255
X=#Mx#
Y=440
W=#TrackW#
H=2

[Prog]
Meter=Image
Group=X
DynamicVariables=1
SolidColor=#Accent#,255
X=#Mx#
Y=440
W=#PW#
H=2

[sIdx]
FontFace=#Mono#
FontSize=11
FontColor=#Accent#
AntiAlias=1
Hidden=1
X=(#Mx#+4)

[sLab]
FontFace=#Display#
FontWeight=600
FontSize=14
FontColor=#Mid#
AntiAlias=1
Hidden=1
X=(#Mx#+70)

[sVal]
FontFace=#Display#
FontWeight=600
FontSize=14
FontColor=#Ink#
AntiAlias=1
Hidden=1
X=(#Mx#+420)

[I1]
Meter=String
MeterStyle=sIdx
Group=X | L1
Text=01
Y=484
[A1]
Meter=String
MeterStyle=sLab
Group=X | L1
Text=SESSION
Y=480
[V1]
Meter=String
MeterStyle=sVal
Group=X | L1
Text=READY
Y=480

