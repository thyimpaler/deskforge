; deskforge boot sequence: plays once after sign-in, then removes itself.
; desk-startup.ps1 writes the real check results to @Resources\bootseq.inc and activates this skin.
; Black cover -> status lines appear one by one -> cover wipes away top to bottom -> panel intro replays.
; ASCII only. Physical px, 1920x1080. Image + String meters only (no Shape meters, no fades).
; If anything fails, the last step still deactivates the skin, so it can never stay on screen.

[Rainmeter]
Update=-1
AccurateText=1
OnRefreshAction=[!FadeDuration 0][!ZPos 2][!ClickThrough 1][!Draggable 0][!KeepOnScreen 0][!Move 0 0][!CommandMeasure mSeq "Execute 1"]

[Metadata]
Name=deskforge Boot
Author=deskforge contributors

[Variables]
BTime=--:--
BNet=UNKNOWN
BNetCol=233,233,233
BWid=-/-
BWidCol=233,233,233
BFeed=UNKNOWN
BDock=UNKNOWN
PW=1
CH=1080
@Include=#@#bootseq.inc

[mSeq]
Measure=Plugin
Plugin=ActionTimer
DynamicVariables=1
ActionList1=Wait 300 | S1 | Wait 210 | S2 | Wait 210 | S3 | Wait 210 | S4 | Wait 210 | S5 | Wait 280 | S6 | Wait 700 | Clear | Wait 40 | Repeat Wipe, 25, 9 | Wait 40 | Done
S1=[!ShowMeterGroup L1][!SetVariable PW 253][!UpdateMeter Prog][!Redraw]
S2=[!ShowMeterGroup L2][!SetVariable PW 506][!UpdateMeter Prog][!Redraw]
S3=[!ShowMeterGroup L3][!SetVariable PW 760][!UpdateMeter Prog][!Redraw]
S4=[!ShowMeterGroup L4][!SetVariable PW 1013][!UpdateMeter Prog][!Redraw]
S5=[!ShowMeterGroup L5][!SetVariable PW 1266][!UpdateMeter Prog][!Redraw]
S6=[!ShowMeterGroup L6][!SetVariable PW 1520][!UpdateMeter Prog][!Redraw]
Clear=[!HideMeterGroup X][!Redraw][!CommandMeasure mIntro "Execute 1" "deskforge\Panel"]
Wipe=[!SetVariable CH "(Max([#CH]-120,1))"][!UpdateMeter Cover][!Redraw]
Done=[!DeactivateConfig "deskforge\Boot"]

[Cover]
Meter=Image
DynamicVariables=1
SolidColor=8,8,8,255
X=0
Y=(1080-#CH#)
W=1920
H=#CH#

[Tag]
Meter=String
Group=X
Text=DESK / BOOT  #BTime#
FontFace=Consolas
FontSize=10
FontColor=164,22,26
AntiAlias=1
X=204
Y=262

[Mark]
Meter=String
