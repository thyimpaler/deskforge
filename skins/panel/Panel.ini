; deskforge desk panel: clock, weather, BTC/ETH, machine, Claude status.
; Data: Open-Meteo, CoinGecko and status.claude.com (all free, no keys).
; Redraws once a second; web data refreshes every 60s (prices), 10 min (weather), 5 min (status).
; Sizes are PHYSICAL pixels: Rainmeter runs DPI-aware (AppCompat HIGHDPIAWARE) so text renders sharp at 150%.
; Intro: on load, T animates 0 -> 1 (~1.3s). Each section k eases in (rise 24px + fade), staggered 0.15s.
; T defaults to 1, so if the intro ever fails the panel is simply fully visible.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!CommandMeasure mIntro "Execute 1"]
ContextTitle=Refresh data now
ContextAction=[!CommandMeasure mBTCweb "Update"][!CommandMeasure mWeather "Update"][!CommandMeasure mStatusWeb "Update"]
ContextTitle2=Replay intro
ContextAction2=[!CommandMeasure mIntro "Execute 1"]

[Metadata]
Name=deskforge Panel
Author=deskforge contributors

[Variables]
W=360
Ink=233,233,233
Mid=150,150,150
Dim=92,92,92
Rule=34,34,34
Red=164,22,26
Amber=212,137,42
Display=Bahnschrift
Mono=Consolas
Lat=51.51
Lon=-0.13
City=LONDON
T=1
Rise=24
; colours set by the data measures (defaults until data arrives)
BTCcol=150,150,150
ETHcol=150,150,150
StCol=92,92,92
BootCol=92,92,92

; ---------------------------------------------------------------- intro

[mIntro]
Measure=Plugin
Plugin=ActionTimer
DynamicVariables=1
ActionList1=Reset | Wait 350 | Step | Repeat Step, 20, 64
Reset=[!SetVariable T 0][!UpdateMeasureGroup E][!UpdateMeterGroup A][!Redraw]
Step=[!SetVariable T "(Clamp([#T]+1/64,0,1))"][!UpdateMeasureGroup E][!UpdateMeterGroup A][!Redraw]

[mE0]
Measure=Calc
Group=E
DynamicVariables=1
Formula=1-(1-Clamp((#T#*1.5-0.00)/0.9,0,1))**4

[mE1]
Measure=Calc
Group=E
DynamicVariables=1
Formula=1-(1-Clamp((#T#*1.5-0.15)/0.9,0,1))**4

[mE2]
Measure=Calc
Group=E
DynamicVariables=1
Formula=1-(1-Clamp((#T#*1.5-0.30)/0.9,0,1))**4

[mE3]
Measure=Calc
Group=E
DynamicVariables=1
Formula=1-(1-Clamp((#T#*1.5-0.45)/0.9,0,1))**4

[mE4]
Measure=Calc
Group=E
DynamicVariables=1
Formula=1-(1-Clamp((#T#*1.5-0.60)/0.9,0,1))**4

[mBoot]
Measure=WebParser
URL=file://#@#bootcheck.txt
CodePage=65001
UpdateRate=30
RegExp=(?siU)^(.*)\|(.*)$
OnRegExpErrorAction=[!SetVariable BootCol "#Dim#"]

[mBootState]
Measure=WebParser
URL=[mBoot]
StringIndex=1
IfMatch=^ok$
IfMatchAction=[!SetVariable BootCol "#Dim#"]
IfMatch2=^warn$
IfMatchAction2=[!SetVariable BootCol "#Amber#"]
IfMatch3=^fail$
IfMatchAction3=[!SetVariable BootCol "#Red#"]

[mBootText]
Measure=WebParser
URL=[mBoot]
StringIndex=2
Substitute="":"BOOT  .  CHECKING"

; ---------------------------------------------------------------- measures

[mHour]
Measure=Time
Format=%#I:%M

[mAmPm]
Measure=Time
Format=%p  .  %a %#d %b

[mSec]
Measure=Time
Format=%S

[mTick]
Measure=Calc
Formula=Round(mSec / 59 * (#W# - 4))
DynamicVariables=1

[mWeather]
Measure=WebParser
URL=https://api.open-meteo.com/v1/forecast?latitude=#Lat#&longitude=#Lon#&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto
UpdateRate=600
RegExp=(?siU)"current":\{.*"temperature_2m":(.*),.*"relative_humidity_2m":(.*),.*"weather_code":(.*),.*"wind_speed_10m":(.*)\}

[mTemp]
Measure=WebParser
URL=[mWeather]
StringIndex=1
RegExpSubstitute=1
Substitute="^(-?\d+)\.\d+$":"\1","^$":"--"

[mHum]
Measure=WebParser
URL=[mWeather]
StringIndex=2

[mCode]
Measure=WebParser
URL=[mWeather]
StringIndex=3
RegExpSubstitute=1
Substitute="^0$":"CLEAR","^[12]$":"PARTLY CLOUDY","^3$":"OVERCAST","^4[58]$":"FOG","^5\d$":"DRIZZLE","^(6\d|8[012])$":"RAIN","^(7\d|8[56])$":"SNOW","^9\d$":"STORM","^$":"..."

[mWind]
Measure=WebParser
URL=[mWeather]
StringIndex=4
RegExpSubstitute=1
Substitute="^(\d+)\.\d+$":"\1"

[mBTCweb]
Measure=WebParser
URL=https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true
UpdateRate=60
RegExp=(?siU)"bitcoin":\{"usd":(.*),"usd_24h_change":(.*)\}.*"ethereum":\{"usd":(.*),"usd_24h_change":(.*)\}

[mBTC]
Measure=WebParser
URL=[mBTCweb]
StringIndex=1
RegExpSubstitute=1
Substitute="\.\d+$":"","(\d)(?=(\d{3})+$)":"\1,","^$":"--"

[mBTCchg]
Measure=WebParser
URL=[mBTCweb]
StringIndex=2
RegExpSubstitute=1
Substitute="^(-?\d+\.\d\d)\d*$":"\1","^(\d)":"+\1","^(.+)$":"\1%"
IfMatch=^-
IfMatchAction=[!SetVariable BTCcol "#Red#"]
IfNotMatchAction=[!SetVariable BTCcol "#Amber#"]

[mETH]
Measure=WebParser
URL=[mBTCweb]
StringIndex=3
RegExpSubstitute=1
Substitute="\.\d+$":"","(\d)(?=(\d{3})+$)":"\1,","^$":"--"

[mETHchg]
Measure=WebParser
URL=[mBTCweb]
StringIndex=4
RegExpSubstitute=1
Substitute="^(-?\d+\.\d\d)\d*$":"\1","^(\d)":"+\1","^(.+)$":"\1%"
IfMatch=^-
IfMatchAction=[!SetVariable ETHcol "#Red#"]
IfNotMatchAction=[!SetVariable ETHcol "#Amber#"]

[mDiskFree]
Measure=FreeDiskSpace
Drive=C:
UpdateDivider=30

[mDiskTotal]
Measure=FreeDiskSpace
Drive=C:
Total=1
UpdateDivider=30

[mDiskUsedPct]
Measure=Calc
Formula=(mDiskTotal - mDiskFree) / mDiskTotal
MinValue=0
MaxValue=1
UpdateDivider=30

[mRAM]
Measure=PhysicalMemory
UpdateDivider=2

[mCPU]
Measure=CPU
UpdateDivider=2

[mStatusWeb]
Measure=WebParser
URL=https://status.claude.com/api/v2/status.json
UpdateRate=300
RegExp=(?siU)"status":\{"indicator":"(.*)","description":"(.*)"\}

[mStatusInd]
Measure=WebParser
URL=[mStatusWeb]
StringIndex=1
IfMatch=^none$
IfMatchAction=[!SetVariable StCol "#Mid#"]
IfMatch2=^minor$
IfMatchAction2=[!SetVariable StCol "#Amber#"]
IfMatch3=^(major|critical)$
IfMatchAction3=[!SetVariable StCol "#Red#"]

[mStatusText]
Measure=WebParser
URL=[mStatusWeb]
StringIndex=2
RegExpSubstitute=1
Substitute="^All Systems Operational$":"OPERATIONAL","^$":"CHECKING"

; ---------------------------------------------------------------- styles

[sA]
Group=A
DynamicVariables=1
AntiAlias=1

[sLabel]
FontFace=#Mono#
FontSize=10
StringCase=Upper

[sSmall]
FontFace=#Mono#
FontSize=12

[sBig]
FontFace=#Display#
FontWeight=600

; ---------------------------------------------------------------- 01 clock

[Bg]
Meter=Shape
Shape=Rectangle 0,0,#W#,10 | Fill Color 0,0,0,1 | StrokeWidth 0

[BootLine]
Meter=String
MeasureName=mBootText
MeterStyle=sA | sLabel
FontColor=#BootCol#,(255*[mE0])
X=0
Y=0

[Clock]
Meter=String
MeasureName=mHour
MeterStyle=sA | sBig
FontSize=66
FontColor=#Ink#,(255*[mE0])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE0]))
X=-6
Y=6R

[ClockSub]
Meter=String
MeasureName=mAmPm
MeterStyle=sA | sSmall
StringCase=Upper
FontColor=#Mid#,(255*[mE0])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE0]))
X=0
Y=0R

[SecTrack]
Meter=Shape
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE0]))
MeterStyle=sA
X=0
Y=15R
Shape=Rectangle 0,4,(Max(#W#*[mE0],1)),1 | Fill Color #Rule# | StrokeWidth 0

[SecTick]
Meter=Shape
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE0]))
MeterStyle=sA
X=([mTick]*[mE0])
Y=r
Shape=Rectangle 0,0,4,10 | Fill Color #Red#,(255*[mE0]) | StrokeWidth 0

; ---------------------------------------------------------------- 02 weather

[WLabel]
Meter=String
MeterStyle=sA | sLabel
FontColor=#Dim#,(255*[mE1])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE1]))
Text=02 / #City#
X=0
Y=39r

[Temp]
Meter=String
MeasureName=mTemp
MeterStyle=sA | sBig
FontSize=39
FontColor=#Ink#,(255*[mE1])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE1]))
Text=%1[\x00B0]
X=-3
Y=6R

[WDesc]
Meter=String
MeasureName=mCode
MeasureName2=mHum
MeasureName3=mWind
MeterStyle=sA | sSmall
StringCase=Upper
FontColor=#Mid#,(255*[mE1])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE1]))
Text=%1#CRLF#%2% HUMID  .  %3 KM/H
X=18R
Y=9r

; ---------------------------------------------------------------- 03 tape

[TLabel]
Meter=String
MeterStyle=sA | sLabel
FontColor=#Dim#,(255*[mE2])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE2]))
Text=03 / TAPE
X=0
Y=96r

[BTCk]
Meter=String
MeterStyle=sA | sSmall
FontColor=#Mid#,(255*[mE2])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE2]))
Text=BTC
X=0
Y=15R

[BTC]
Meter=String
MeasureName=mBTC
MeterStyle=sA | sBig
FontSize=24
FontColor=#Ink#,(255*[mE2])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE2]))
Text=$%1
X=51
Y=-9r

[BTCchg]
Meter=String
MeasureName=mBTCchg
MeterStyle=sA | sSmall
FontColor=#BTCcol#,(255*[mE2])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE2]))
StringAlign=Right
X=#W#
Y=12r

[ETHk]
Meter=String
MeterStyle=sA | sSmall
FontColor=#Mid#,(255*[mE2])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE2]))
Text=ETH
X=0
Y=39r

[ETH]
Meter=String
MeasureName=mETH
MeterStyle=sA | sBig
FontSize=24
FontColor=#Ink#,(255*[mE2])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE2]))
Text=$%1
X=51
Y=-9r

[ETHchg]
Meter=String
MeasureName=mETHchg
MeterStyle=sA | sSmall
FontColor=#ETHcol#,(255*[mE2])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE2]))
StringAlign=Right
X=#W#
Y=12r

; ---------------------------------------------------------------- 04 machine

[MLabel]
Meter=String
MeterStyle=sA | sLabel
FontColor=#Dim#,(255*[mE3])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE3]))
Text=04 / MACHINE
X=0
Y=60r

[DiskK]
Meter=String
MeasureName=mDiskFree
MeterStyle=sA | sSmall
FontColor=#Mid#,(255*[mE3])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE3]))
AutoScale=1
NumOfDecimals=1
Text=C:  %1B FREE
X=0
Y=15R

[DiskBar]
Meter=Bar
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE3]))
MeasureName=mDiskUsedPct
MeterStyle=sA
X=0
Y=6R
W=(Max(#W#*[mE3],1))
H=3
BarColor=#Mid#,(255*[mE3])
SolidColor=#Rule#,(255*[mE3])
BarOrientation=Horizontal

[RAMK]
Meter=String
MeasureName=mRAM
MeterStyle=sA | sSmall
FontColor=#Mid#,(255*[mE3])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE3]))
Percentual=1
Text=RAM  %1%
X=0
Y=15R

[RAMBar]
Meter=Bar
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE3]))
MeasureName=mRAM
MeterStyle=sA
X=0
Y=6R
W=(Max(#W#*[mE3],1))
H=3
BarColor=#Mid#,(255*[mE3])
SolidColor=#Rule#,(255*[mE3])
BarOrientation=Horizontal

[CPUK]
Meter=String
MeasureName=mCPU
MeterStyle=sA | sSmall
FontColor=#Mid#,(255*[mE3])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE3]))
Text=CPU  %1%
X=0
Y=15R

[CPUBar]
Meter=Bar
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE3]))
MeasureName=mCPU
MeterStyle=sA
X=0
Y=6R
W=(Max(#W#*[mE3],1))
H=3
BarColor=#Red#,(255*[mE3])
SolidColor=#Rule#,(255*[mE3])
BarOrientation=Horizontal

; ---------------------------------------------------------------- 05 claude

[CLabel]
Meter=String
MeterStyle=sA | sLabel
FontColor=#Dim#,(255*[mE4])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE4]))
Text=05 / CLAUDE
X=0
Y=33R

[StatusSq]
Meter=Shape
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE4]))
MeterStyle=sA
X=0
Y=21R
Shape=Rectangle 0,0,12,12 | Fill Color #StCol#,(255*[mE4]) | StrokeWidth 0

[StatusT]
Meter=String
MeasureName=mStatusText
MeterStyle=sA | sSmall
FontColor=#Ink#,(255*[mE4])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE4]))
StringCase=Upper
X=24
Y=-6r
LeftMouseUpAction=["https://status.claude.com"]
