; deskforge panel: clock, weather, two coin prices, machine load, Claude status.
; Data: Open-Meteo, CoinGecko and status.claude.com. All free, no keys.
; Redraws once a second. Prices refresh every #PriceRate# seconds (60 minimum), weather every 10 min, status every 5 min.
; Each network section shows OFFLINE next to its label when a request fails, and keeps retrying.
; Intro: on load, T animates 0 -> 1 (about 1.3 s). Each section eases in (rise 24 px + fade), staggered 0.15 s.
; T defaults to 1, so if the intro ever fails the panel is simply fully visible.
; Colours and fonts come from @Resources\theme.inc, city, units and coins from @Resources\desk.inc.
; Both are written by tools\install.ps1.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!CommandMeasure mIntro "Execute 1"]
ContextTitle=Refresh data now
ContextAction=[!CommandMeasure mCoin1Web "Update"][!CommandMeasure mCoin2Web "Update"][!CommandMeasure mWeather "Update"][!CommandMeasure mStatusWeb "Update"]
ContextTitle2=Replay intro
ContextAction2=[!CommandMeasure mIntro "Execute 1"]

[Metadata]
Name=deskforge Panel
Author=deskforge contributors
License=MIT

[Variables]
@Include=#@#theme.inc
@Include2=#@#desk.inc
W=360
T=1
Rise=24
; colours set by the data measures (defaults until data arrives)
C1col=#Mid#
C2col=#Mid#
StCol=#Dim#
BootCol=#Dim#
WxNote=
PxNote=
StNote=

; ---------------------------------------------------------------- intro

[mIntro]
Measure=Plugin
Plugin=ActionTimer
DynamicVariables=1
ActionList1=Reset | Wait 350 | Step | Repeat Step, 20, 64
Reset=[!SetVariable T 0][!UpdateMeasureGroup E][!UpdateMeterGroup A][!Redraw]
Step=[!SetVariable T "(Clamp([#T]+1/64,0,1))"][!UpdateMeasureGroup E][!UpdateMeterGroup A][!Redraw]

[mE0]
Measure=Calc
Group=E
DynamicVariables=1
Formula=1-(1-Clamp((#T#*1.5-0.00)/0.9,0,1))**4

[mE1]
Measure=Calc
Group=E
DynamicVariables=1
Formula=1-(1-Clamp((#T#*1.5-0.15)/0.9,0,1))**4

[mE2]
Measure=Calc
Group=E
DynamicVariables=1
Formula=1-(1-Clamp((#T#*1.5-0.30)/0.9,0,1))**4

[mE3]
Measure=Calc
Group=E
DynamicVariables=1
Formula=1-(1-Clamp((#T#*1.5-0.45)/0.9,0,1))**4

[mE4]
Measure=Calc
Group=E
DynamicVariables=1
Formula=1-(1-Clamp((#T#*1.5-0.60)/0.9,0,1))**4

; ---------------------------------------------------------------- boot line (written by the optional startup check)

[mBoot]
Measure=WebParser
URL=file://#@#bootcheck.txt
CodePage=65001
UpdateRate=30
RegExp=(?siU)^(.*)\|(.*)$
OnRegExpErrorAction=[!SetVariable BootCol "#Dim#"]
OnConnectErrorAction=[!SetVariable BootCol "#Dim#"]

[mBootState]
Measure=WebParser
URL=[mBoot]
StringIndex=1
IfMatch=^ok$
IfMatchAction=[!SetVariable BootCol "#Dim#"]
IfMatch2=^warn$
IfMatchAction2=[!SetVariable BootCol "#Warn#"]
IfMatch3=^fail$
IfMatchAction3=[!SetVariable BootCol "#Accent#"]

[mBootText]
Measure=WebParser
URL=[mBoot]
StringIndex=2

; ---------------------------------------------------------------- measures

[mHour]
Measure=Time
Format=#ClockFmt#

[mAmPm]
Measure=Time
Format=#ClockSubFmt#

[mSec]
Measure=Time
Format=%S

[mTick]
Measure=Calc
Formula=Round(mSec / 59 * (#W# - 4))
DynamicVariables=1

[mWeather]
Measure=WebParser
URL=https://api.open-meteo.com/v1/forecast?latitude=#Lat#&longitude=#Lon#&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&temperature_unit=#TempUnit#&wind_speed_unit=#WindUnit#&timezone=auto
UpdateRate=600
RegExp=(?siU)"current":\{.*"temperature_2m":(.*),.*"relative_humidity_2m":(.*),.*"weather_code":(.*),.*"wind_speed_10m":(.*)\}
FinishAction=[!SetVariable WxNote ""]
OnConnectErrorAction=[!SetVariable WxNote "  OFFLINE"]
OnRegExpErrorAction=[!SetVariable WxNote "  NO DATA"]

[mTemp]
Measure=WebParser
URL=[mWeather]
StringIndex=1
RegExpSubstitute=1
Substitute="^(-?\d+)\.\d+$":"\1","^$":"--"

[mHum]
Measure=WebParser
URL=[mWeather]
StringIndex=2
Substitute="":"--"

[mCode]
Measure=WebParser
URL=[mWeather]
StringIndex=3
RegExpSubstitute=1
Substitute="^0$":"CLEAR","^[12]$":"PARTLY CLOUDY","^3$":"OVERCAST","^4[58]$":"FOG","^5\d$":"DRIZZLE","^(6\d|8[012])$":"RAIN","^(7\d|8[56])$":"SNOW","^9\d$":"STORM","^$":"..."

[mWind]
Measure=WebParser
URL=[mWeather]
StringIndex=4
RegExpSubstitute=1
Substitute="^(\d+)\.\d+$":"\1","^$":"--"

; One request per coin, so the order CoinGecko returns ids in never matters.
[mCoin1Web]
Measure=WebParser
URL=https://api.coingecko.com/api/v3/simple/price?ids=#Coin1#&vs_currencies=usd&include_24hr_change=true
UpdateRate=#PriceRate#
RegExp=(?siU)"usd":(.*),"usd_24h_change":(.*)\}
FinishAction=[!SetVariable PxNote ""]
OnConnectErrorAction=[!SetVariable PxNote "  OFFLINE"]
OnRegExpErrorAction=[!SetVariable PxNote "  NO DATA"]

[mCoin1]
Measure=WebParser
URL=[mCoin1Web]
StringIndex=1
RegExpSubstitute=1
Substitute="\.\d+$":"","(\d)(?=(\d{3})+$)":"\1,","^$":"--"

[mCoin1chg]
Measure=WebParser
URL=[mCoin1Web]
StringIndex=2
RegExpSubstitute=1
Substitute="^(-?\d+\.\d\d)\d*$":"\1","^(\d)":"+\1","^(.+)$":"\1%"
IfMatch=^-
IfMatchAction=[!SetVariable C1col "#Accent#"]
IfNotMatchAction=[!SetVariable C1col "#Warn#"]

[mCoin2Web]
Measure=WebParser
URL=https://api.coingecko.com/api/v3/simple/price?ids=#Coin2#&vs_currencies=usd&include_24hr_change=true
UpdateRate=#PriceRate#
Disabled=#Coin2Hidden#
RegExp=(?siU)"usd":(.*),"usd_24h_change":(.*)\}

[mCoin2]
Measure=WebParser
URL=[mCoin2Web]
StringIndex=1
Disabled=#Coin2Hidden#
RegExpSubstitute=1
Substitute="\.\d+$":"","(\d)(?=(\d{3})+$)":"\1,","^$":"--"

[mCoin2chg]
Measure=WebParser
URL=[mCoin2Web]
StringIndex=2
Disabled=#Coin2Hidden#
RegExpSubstitute=1
Substitute="^(-?\d+\.\d\d)\d*$":"\1","^(\d)":"+\1","^(.+)$":"\1%"
IfMatch=^-
IfMatchAction=[!SetVariable C2col "#Accent#"]
IfNotMatchAction=[!SetVariable C2col "#Warn#"]

[mDiskFree]
Measure=FreeDiskSpace
Drive=C:
UpdateDivider=30

[mDiskTotal]
Measure=FreeDiskSpace
Drive=C:
Total=1
UpdateDivider=30

[mDiskUsedPct]
Measure=Calc
Formula=(mDiskTotal - mDiskFree) / mDiskTotal
MinValue=0
MaxValue=1
UpdateDivider=30

[mRAM]
Measure=PhysicalMemory
UpdateDivider=2

[mCPU]
Measure=CPU
UpdateDivider=2

[mStatusWeb]
Measure=WebParser
URL=https://status.claude.com/api/v2/status.json
UpdateRate=300
RegExp=(?siU)"status":\{"indicator":"(.*)","description":"(.*)"\}
FinishAction=[!SetVariable StNote ""]
OnConnectErrorAction=[!SetVariable StNote "  OFFLINE"][!SetVariable StCol "#Dim#"]
OnRegExpErrorAction=[!SetVariable StNote "  NO DATA"]

[mStatusInd]
Measure=WebParser
URL=[mStatusWeb]
StringIndex=1
IfMatch=^none$
IfMatchAction=[!SetVariable StCol "#Mid#"]
IfMatch2=^minor$
IfMatchAction2=[!SetVariable StCol "#Warn#"]
IfMatch3=^(major|critical)$
IfMatchAction3=[!SetVariable StCol "#Accent#"]

[mStatusText]
Measure=WebParser
URL=[mStatusWeb]
StringIndex=2
RegExpSubstitute=1
Substitute="^All Systems Operational$":"OPERATIONAL","^$":"CHECKING"

; ---------------------------------------------------------------- styles

[sA]
Group=A
DynamicVariables=1
AntiAlias=1

[sLabel]
FontFace=#Mono#
FontSize=10
StringCase=Upper

[sSmall]
FontFace=#Mono#
FontSize=12

[sBig]
FontFace=#Display#
FontWeight=600

; ---------------------------------------------------------------- 01 clock

[Bg]
Meter=Image
SolidColor=0,0,0,1
W=#W#
H=10

[BootLine]
Meter=String
MeasureName=mBootText
MeterStyle=sA | sLabel
FontColor=#BootCol#,(255*[mE0])
X=0
Y=0

[Clock]
Meter=String
MeasureName=mHour
MeterStyle=sA | sBig
FontSize=66
FontColor=#Ink#,(255*[mE0])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE0]))
X=-6
Y=6R

[ClockSub]
Meter=String
MeasureName=mAmPm
MeterStyle=sA | sSmall
StringCase=Upper
FontColor=#Mid#,(255*[mE0])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE0]))
X=0
Y=0R

; Bars are Image meters with a solid colour, never Shape meters with changing geometry (that crashed Rainmeter once).
[SecTrack]
Meter=Image
MeterStyle=sA
SolidColor=#Rule#,(255*[mE0])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE0]))
X=0
Y=19R
W=(Max(#W#*[mE0],1))
H=1

[SecTick]
Meter=Image
MeterStyle=sA
SolidColor=#Accent#,(255*[mE0])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE0]))
X=([mTick]*[mE0])
Y=-4r
W=4
H=10

; ---------------------------------------------------------------- 02 weather

[WLabel]
Meter=String
MeterStyle=sA | sLabel
FontColor=#Dim#,(255*[mE1])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE1]))
Text=02 / #City##WxNote#
X=0
Y=39r

[Temp]
Meter=String
MeasureName=mTemp
MeterStyle=sA | sBig
FontSize=39
FontColor=#Ink#,(255*[mE1])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE1]))
Text=%1[\x00B0]
X=-3
Y=6R

[WDesc]
Meter=String
MeasureName=mCode
MeasureName2=mHum
MeasureName3=mWind
MeterStyle=sA | sSmall
StringCase=Upper
FontColor=#Mid#,(255*[mE1])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE1]))
Text=%1#CRLF#%2% HUMID  .  %3 #WindLabel#
X=18R
Y=9r

; ---------------------------------------------------------------- 03 prices

[TLabel]
Meter=String
MeterStyle=sA | sLabel
FontColor=#Dim#,(255*[mE2])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE2]))
Text=03 / PRICES#PxNote#
X=0
Y=96r

[C1k]
Meter=String
MeterStyle=sA | sSmall
FontColor=#Mid#,(255*[mE2])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE2]))
Text=#Coin1Label#
X=0
Y=15R

[C1]
Meter=String
MeasureName=mCoin1
MeterStyle=sA | sBig
FontSize=24
FontColor=#Ink#,(255*[mE2])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE2]))
Text=$%1
X=60
Y=-9r

[C1chg]
Meter=String
MeasureName=mCoin1chg
MeterStyle=sA | sSmall
FontColor=#C1col#,(255*[mE2])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE2]))
StringAlign=Right
X=#W#
Y=12r

[C2k]
Meter=String
MeterStyle=sA | sSmall
FontColor=#Mid#,(255*[mE2])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE2]))
Text=#Coin2Label#
Hidden=#Coin2Hidden#
X=0
Y=39r

[C2]
Meter=String
MeasureName=mCoin2
MeterStyle=sA | sBig
FontSize=24
FontColor=#Ink#,(255*[mE2])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE2]))
Text=$%1
Hidden=#Coin2Hidden#
X=60
Y=-9r

[C2chg]
Meter=String
MeasureName=mCoin2chg
MeterStyle=sA | sSmall
FontColor=#C2col#,(255*[mE2])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE2]))
StringAlign=Right
Hidden=#Coin2Hidden#
X=#W#
Y=12r

; ---------------------------------------------------------------- 04 machine

[MLabel]
Meter=String
MeterStyle=sA | sLabel
FontColor=#Dim#,(255*[mE3])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE3]))
Text=04 / MACHINE
X=0
Y=60r

[DiskK]
Meter=String
MeasureName=mDiskFree
MeterStyle=sA | sSmall
FontColor=#Mid#,(255*[mE3])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE3]))
AutoScale=1
NumOfDecimals=1
Text=C:  %1B FREE
X=0
Y=15R

[DiskBar]
Meter=Bar
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE3]))
MeasureName=mDiskUsedPct
MeterStyle=sA
X=0
Y=6R
W=(Max(#W#*[mE3],1))
H=3
BarColor=#Mid#,(255*[mE3])
SolidColor=#Rule#,(255*[mE3])
BarOrientation=Horizontal

[RAMK]
Meter=String
MeasureName=mRAM
MeterStyle=sA | sSmall
FontColor=#Mid#,(255*[mE3])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE3]))
Percentual=1
Text=RAM  %1%
X=0
Y=15R

[RAMBar]
Meter=Bar
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE3]))
MeasureName=mRAM
MeterStyle=sA
X=0
Y=6R
W=(Max(#W#*[mE3],1))
H=3
BarColor=#Mid#,(255*[mE3])
SolidColor=#Rule#,(255*[mE3])
BarOrientation=Horizontal

[CPUK]
Meter=String
MeasureName=mCPU
MeterStyle=sA | sSmall
FontColor=#Mid#,(255*[mE3])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE3]))
Text=CPU  %1%
X=0
Y=15R

[CPUBar]
Meter=Bar
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE3]))
MeasureName=mCPU
MeterStyle=sA
X=0
Y=6R
W=(Max(#W#*[mE3],1))
H=3
BarColor=#Accent#,(255*[mE3])
SolidColor=#Rule#,(255*[mE3])
BarOrientation=Horizontal

; ---------------------------------------------------------------- 05 claude

[CLabel]
Meter=String
MeterStyle=sA | sLabel
FontColor=#Dim#,(255*[mE4])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE4]))
Text=05 / CLAUDE#StNote#
X=0
Y=33R

[StatusSq]
Meter=Image
MeterStyle=sA
SolidColor=#StCol#,(255*[mE4])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE4]))
X=0
Y=21R
W=12
H=12

[StatusT]
Meter=String
MeasureName=mStatusText
MeterStyle=sA | sSmall
FontColor=#Ink#,(255*[mE4])
TransformationMatrix=1;0;0;1;0;(#Rise#*(1-[mE4]))
StringCase=Upper
X=24
Y=-6r
LeftMouseUpAction=["https://status.claude.com"]
