; deskforge home: full-screen launcher, the laptop version of the TV home screen.
; Opens with Win+Z or the dock's 00 HOME, closes with Esc, a click on empty space, or after a launch.
; Apps focus if already open (via @Resources\dock.exe go KEY).
; Physical px, 1920x1080, always on top, starts hidden.

[Rainmeter]
Update=5000
AccurateText=1
OnRefreshAction=[!Hide]

[Metadata]
Name=deskforge Home
Author=deskforge contributors

[mTime]
Measure=Time
Format=%#I:%M

[mDate]
Measure=Time
Format=%A %#d %B

[sLabel]
FontFace=Consolas
FontSize=10
FontColor=92,92,92
StringCase=Upper
AntiAlias=1

[sRow]
FontFace=Bahnschrift
FontWeight=600
FontSize=19
FontColor=170,170,170
AntiAlias=1
Padding=0,7,80,7
SolidColor=0,0,0,1
InlinePattern=^\d\d
InlineSetting=Color | 84,84,84
InlineSetting2=Face | Consolas
InlinePattern2=^\d\d
InlineSetting3=Size | 10
InlinePattern3=^\d\d
InlineSetting4=Weight | 400
InlinePattern4=^\d\d

[Bg]
Meter=Shape
Shape=Rectangle 0,0,1920,1080 | Fill Color 8,8,8,247 | StrokeWidth 0
Shape2=Rectangle 1186,0,3,1080 | Fill Color 164,22,26,255 | StrokeWidth 0
Shape3=Rectangle 92,340,1736,1 | Fill Color 34,34,34,255 | StrokeWidth 0
LeftMouseUpAction=["#@#dock.exe" "close"]

[Tag]
Meter=String
MeterStyle=sLabel
Text=00 / HOME
X=92
Y=56

[Hint]
Meter=String
MeterStyle=sLabel
StringAlign=Right
Text=ESC TO CLOSE  .  WIN+Z TO OPEN
X=1828
Y=56

[Time]
Meter=String
MeasureName=mTime
FontFace=Bahnschrift
FontWeight=600
FontSize=112
FontColor=240,240,240
AntiAlias=1
InlineSetting=CharacterSpacing | -4 | -4
X=80
Y=66

[Date]
Meter=String
MeasureName=mDate
MeterStyle=sLabel
FontSize=12
FontColor=150,150,150
X=92
Y=276

[Search]
Meter=String
FontFace=Bahnschrift
FontWeight=600
FontSize=26
FontColor=120,120,120
AntiAlias=1
StringAlign=Right
Padding=40,10,0,10
SolidColor=0,0,0,1
Text=Search anything
X=1828
Y=206
LeftMouseUpAction=["#@#dock.exe" "search"]
MouseOverAction=[!SetOption Search FontColor "255,255,255"][!UpdateMeter Search][!Redraw]
MouseLeaveAction=[!SetOption Search FontColor "120,120,120"][!UpdateMeter Search][!Redraw]

[SearchKey]
Meter=String
MeterStyle=sLabel
StringAlign=Right
Text=ALT + SPACE
X=1828
Y=278

[HA]
Meter=String
MeterStyle=sLabel
Text=01 / APPS
X=92
Y=372

[HS]
Meter=String
MeterStyle=sLabel
Text=03 / SYSTEM
X=1290
Y=372
