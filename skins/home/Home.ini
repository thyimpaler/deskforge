; deskforge home: a full-screen launcher.
; Opens with Win+Z or the dock's 00 HOME, closes with Esc, a click on empty space, or after a launch.
; App rows come from @Resources\home.inc, written by install.ps1 from homeApps in desk.json.
; Apps focus if already open (via @Resources\dock.exe go N). Positions scale with the screen size.
; Starts hidden; dock.exe shows and hides it.

[Rainmeter]
Update=5000
AccurateText=1
OnRefreshAction=[!Hide]

[Metadata]
Name=deskforge Home
Author=deskforge contributors
License=MIT

[Variables]
@Include=#@#theme.inc
@Include2=#@#desk.inc
Mx=(#SCREENAREAWIDTH#*0.048)
SysX=(#SCREENAREAWIDTH#*0.67)

[mTime]
Measure=Time
Format=#ClockFmt#

[mDate]
Measure=Time
Format=%A %#d %B

[sLabel]
FontFace=#Mono#
FontSize=10
FontColor=#Dim#
StringCase=Upper
AntiAlias=1

[sRow]
FontFace=#Display#
FontWeight=600
FontSize=19
FontColor=#Mid#
AntiAlias=1
Padding=0,7,80,7
SolidColor=0,0,0,1
InlinePattern=^\d\d
InlineSetting=Color | #Dim#
InlineSetting2=Face | #Mono#
InlinePattern2=^\d\d
InlineSetting3=Size | 10
InlinePattern3=^\d\d
InlineSetting4=Weight | 400
InlinePattern4=^\d\d

[Bg]
Meter=Image
SolidColor=#Surface#,247
W=#SCREENAREAWIDTH#
H=#SCREENAREAHEIGHT#
LeftMouseUpAction=["#@#dock.exe" "close"]

[Stake]
Meter=Image
SolidColor=#Accent#,255
X=(#SCREENAREAWIDTH#*0.618)
Y=0
W=3
H=#SCREENAREAHEIGHT#

[Rule1]
Meter=Image
SolidColor=#Rule#,255
X=#Mx#
Y=340
W=(#SCREENAREAWIDTH#-2*#Mx#)
H=1

[Tag]
Meter=String
MeterStyle=sLabel
Text=00 / HOME
X=#Mx#
Y=56

[Hint]
Meter=String
MeterStyle=sLabel
StringAlign=Right
Text=ESC TO CLOSE  .  WIN+Z TO OPEN
X=(#SCREENAREAWIDTH#-#Mx#)
Y=56

[Time]
Meter=String
MeasureName=mTime
FontFace=#Display#
FontWeight=600
FontSize=112
FontColor=#Ink#
AntiAlias=1
InlineSetting=CharacterSpacing | -4 | -4
X=(#Mx#-12)
Y=66

[Date]
Meter=String
MeasureName=mDate
MeterStyle=sLabel
FontSize=12
FontColor=#Mid#
X=#Mx#
Y=276

[Search]
Meter=String
FontFace=#Display#
FontWeight=600
FontSize=26
FontColor=#Mid#
AntiAlias=1
StringAlign=Right
Padding=40,10,0,10
SolidColor=0,0,0,1
Text=Search anything
X=(#SCREENAREAWIDTH#-#Mx#)
Y=206
LeftMouseUpAction=["#@#dock.exe" "search"]
MouseOverAction=[!SetOption Search FontColor "#Ink#"][!UpdateMeter Search][!Redraw]
MouseLeaveAction=[!SetOption Search FontColor "#Mid#"][!UpdateMeter Search][!Redraw]

[SearchKey]
Meter=String
MeterStyle=sLabel
StringAlign=Right
Text=WIN + S
X=(#SCREENAREAWIDTH#-#Mx#)
Y=278

[HA]
Meter=String
MeterStyle=sLabel
Text=01 / APPS
X=#Mx#
Y=(#SCREENAREAHEIGHT#*0.38-40)

[HS]
Meter=String
MeterStyle=sLabel
Text=02 / SYSTEM
X=#SysX#
Y=(#SCREENAREAHEIGHT#*0.38-40)

[Y1]
Meter=String
MeterStyle=sRow
Text=01  Lock
X=#SysX#
Y=(#SCREENAREAHEIGHT#*0.38)
LeftMouseUpAction=["#@#dock.exe" "go" "lock"]
MouseOverAction=[!SetOption Y1 FontColor "#Ink#"][!SetOption Y1 InlineSetting "Color | #Accent#"][!UpdateMeter Y1][!Redraw]
MouseLeaveAction=[!SetOption Y1 FontColor "#Mid#"][!SetOption Y1 InlineSetting "Color | #Dim#"][!UpdateMeter Y1][!Redraw]

; Power opens the normal Windows "Shut down Windows" dialog; nothing happens until you choose there.
[Y2]
Meter=String
MeterStyle=sRow
Text=02  Power
X=#SysX#
Y=(#SCREENAREAHEIGHT#*0.38+44)
LeftMouseUpAction=["#@#dock.exe" "go" "power"]
MouseOverAction=[!SetOption Y2 FontColor "#Ink#"][!SetOption Y2 InlineSetting "Color | #Accent#"][!UpdateMeter Y2][!Redraw]
MouseLeaveAction=[!SetOption Y2 FontColor "#Mid#"][!SetOption Y2 InlineSetting "Color | #Dim#"][!UpdateMeter Y2][!Redraw]

@Include3=#@#home.inc
