; deskforge now-playing: Spotify track under the candle tape.
; @Resources\nowplaying.exe (idle priority, ~1.5s poll of Spotify's window title) writes nowplaying.txt;
; this skin reads it every 2s. Fades out when nothing is playing, fades in on each new track.
; Physical pixels (Rainmeter runs DPI-aware).

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=["#@#nowplaying.exe"]

[Metadata]
Name=deskforge Now Playing
Author=deskforge contributors

[Variables]
Ink=233,233,233
Mid=150,150,150
Dim=92,92,92
Red=164,22,26
Display=Bahnschrift
Mono=Consolas
A=0
V=0
MaxW=330

[mFile]
Measure=WebParser
URL=file://#@#nowplaying.txt
CodePage=65001
UpdateRate=2
RegExp=(?siU)^(.*)\n(.*)$
FinishAction=[!UpdateMeasure mSong][!UpdateMeasure mArtist]
OnRegExpErrorAction=[!SetVariable A 0][!UpdateMeterGroup N][!Redraw]

[mSong]
Measure=WebParser
URL=[mFile]
StringIndex=1
; V hides everything when nothing plays; A fades in once per new track.
IfMatch=^$
IfMatchAction=[!SetVariable V 0][!UpdateMeterGroup N][!Redraw]
IfNotMatchAction=[!SetVariable V 1][!UpdateMeterGroup N][!Redraw]
OnChangeAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 1"]

[mArtist]
Measure=WebParser
URL=[mFile]
StringIndex=2

[mFade]
Measure=Plugin
Plugin=ActionTimer
DynamicVariables=1
ActionList1=SetZero | Wait 60 | Up | Repeat Up, 25, 20
SetZero=[!SetVariable A 0][!UpdateMeterGroup N][!Redraw]
Up=[!SetVariable A "(Clamp([#A]+13,0,255))"][!UpdateMeterGroup N][!Redraw]

[sN]
Group=N
DynamicVariables=1
AntiAlias=1

[Bg]
Meter=Shape
Shape=Rectangle 0,0,10,10 | Fill Color 0,0,0,1 | StrokeWidth 0

[Label]
Meter=String
MeterStyle=sN
FontFace=#Mono#
FontSize=10
FontColor=#Dim#,(#A#*#V#)
StringCase=Upper
Text=06 / NOW PLAYING
X=0
Y=0

[Tick]
Meter=Shape
MeterStyle=sN
X=0
Y=10R
Shape=Rectangle 0,0,4,30 | Fill Color #Red#,(#A#*#V#) | StrokeWidth 0

[Song]
Meter=String
MeasureName=mSong
MeterStyle=sN
FontFace=#Display#
FontWeight=600
FontSize=24
FontColor=#Ink#,(#A#*#V#)
ClipString=1
W=#MaxW#
X=16
Y=-6r

[Artist]
Meter=String
MeasureName=mArtist
MeterStyle=sN
FontFace=#Mono#
FontSize=12
FontColor=#Mid#,(#A#*#V#)
StringCase=Upper
ClipString=1
W=#MaxW#
X=16
Y=2R
