; deskforge dock: replaces the Windows taskbar. Indexed text row, no icons.
; idle = grey, open = red index, focused = white. Click focuses / minimizes / launches.
; Labels and states are pushed by @Resources\dock.exe; this skin only keeps the clock and battery.
; Physical px: 1920x56 at 0,1024, always on top. Rainmeter reserves the 56px (DesktopWorkArea).

[Rainmeter]
Update=5000
AccurateText=1
OnRefreshAction=["#@#dock.exe"]

[Metadata]
Name=deskforge Dock
Author=deskforge contributors

[Variables]
T1=
C1=96,96,96
K1=62,62,62
T2=
C2=96,96,96
K2=62,62,62
T3=
C3=96,96,96
K3=62,62,62
T4=
C4=96,96,96
K4=62,62,62
T5=
C5=96,96,96
K5=62,62,62
T6=
C6=96,96,96
K6=62,62,62
T7=
C7=96,96,96
K7=62,62,62
T8=
C8=96,96,96
K8=62,62,62
T9=
C9=96,96,96
K9=62,62,62
T10=
C10=96,96,96
K10=62,62,62
T11=
C11=96,96,96
K11=62,62,62
T12=
C12=96,96,96
K12=62,62,62
T13=
C13=96,96,96
K13=62,62,62
T14=
C14=96,96,96
K14=62,62,62
Vol=--
VolW=1
Bri=--
BriW=1

[mTime]
Measure=Time
Format=%#I:%M %p

[mBat]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent

[mAC]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLine
Substitute="1":"AC","0":"BAT"

[sS]
Group=D
DynamicVariables=1
FontFace=Bahnschrift
FontWeight=600
FontSize=12
AntiAlias=1
Padding=14,17,14,17
SolidColor=0,0,0,1
InlinePattern=^\d\d
InlineSetting2=Face | Consolas
InlinePattern2=^\d\d
InlineSetting3=Size | 9
InlinePattern3=^\d\d
InlineSetting4=Weight | 400
InlinePattern4=^\d\d

[Bg]
Meter=Shape
Shape=Rectangle 0,0,1920,56 | Fill Color 10,10,10,255 | StrokeWidth 0
Shape2=Rectangle 0,0,1920,1 | Fill Color 34,34,34,255 | StrokeWidth 0

[Home]
Meter=String
MeterStyle=sS
Group=
Text=00  HOME
FontColor=245,245,245
InlineSetting=Color | 164,22,26
X=10
Y=1
LeftMouseUpAction=["#@#dock.exe" "home"]
MouseOverAction=[!SetOption Home SolidColor "26,26,26,255"][!UpdateMeter Home][!Redraw]
MouseLeaveAction=[!SetOption Home SolidColor "0,0,0,1"][!UpdateMeter Home][!Redraw]

[Div]
Meter=Shape
X=8R
Y=16
Shape=Rectangle 0,0,1,24 | Fill Color 46,46,46,255 | StrokeWidth 0

[Anchor]
Meter=String
Text=
X=6R
Y=1

[S1]
Meter=String
MeterStyle=sS
Text=#T1#
FontColor=#C1#
InlineSetting=Color | #K1#
X=2R
Y=0r
LeftMouseUpAction=["#@#dock.exe" "act" "1"]
MouseOverAction=[!SetOption S1 SolidColor "26,26,26,255"][!UpdateMeter S1][!Redraw]
MouseLeaveAction=[!SetOption S1 SolidColor "0,0,0,1"][!UpdateMeter S1][!Redraw]

