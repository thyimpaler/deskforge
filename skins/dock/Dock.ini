; deskforge dock: replaces the taskbar with an indexed text row, no icons.
; idle = dim, open = accent index, focused = ink. Click focuses, minimizes or launches.
; Labels and states are pushed by @Resources\dock.exe; this skin keeps the clock, battery, volume and brightness.
; Full screen width, 56 px tall, top or bottom (desk.json "dock"). dock.exe reserves the strip as an AppBar,
; so maximized windows stop at the dock. Colours and fonts come from the theme.

[Rainmeter]
Update=5000
AccurateText=1
OnRefreshAction=[!ZPos 2]["#@#dock.exe"]

[Metadata]
Name=deskforge Dock
Author=deskforge contributors
License=MIT

[Variables]
@Include=#@#theme.inc
@Include2=#@#desk.inc
T1=
C1=#Dim#
K1=#Rule#
T2=
C2=#Dim#
K2=#Rule#
T3=
C3=#Dim#
K3=#Rule#
T4=
C4=#Dim#
K4=#Rule#
T5=
C5=#Dim#
K5=#Rule#
T6=
C6=#Dim#
K6=#Rule#
T7=
C7=#Dim#
K7=#Rule#
T8=
C8=#Dim#
K8=#Rule#
T9=
C9=#Dim#
K9=#Rule#
T10=
C10=#Dim#
K10=#Rule#
T11=
C11=#Dim#
K11=#Rule#
T12=
C12=#Dim#
K12=#Rule#
T13=
C13=#Dim#
K13=#Rule#
Vol=--
VolW=1
Bri=--
BriW=1

[mTime]
Measure=Time
Format=#DockClockFmt#

[mBat]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent

[mAC]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLine
Substitute="1":"AC","0":"BAT"

[sS]
Group=D
DynamicVariables=1
FontFace=#Display#
FontWeight=600
FontSize=12
AntiAlias=1
Padding=14,17,14,17
SolidColor=0,0,0,1
InlinePattern=^\d\d
InlineSetting2=Face | #Mono#
InlinePattern2=^\d\d
InlineSetting3=Size | 9
InlinePattern3=^\d\d
InlineSetting4=Weight | 400
InlinePattern4=^\d\d

[Bg]
Meter=Image
SolidColor=#Surface#,255
W=#SCREENAREAWIDTH#
H=56

[Edge]
Meter=Image
SolidColor=#Rule#,255
X=0
Y=0
W=#SCREENAREAWIDTH#
H=1

[Home]
Meter=String
MeterStyle=sS
Group=
Text=00  HOME
FontColor=#Ink#
InlineSetting=Color | #Accent#
X=10
Y=1
LeftMouseUpAction=["#@#dock.exe" "home"]
MouseOverAction=[!SetOption Home SolidColor "#Rule#,255"][!UpdateMeter Home][!Redraw]
MouseLeaveAction=[!SetOption Home SolidColor "0,0,0,1"][!UpdateMeter Home][!Redraw]

[Div]
Meter=Image
SolidColor=#Rule#,255
X=8R
Y=16
W=1
H=24

[Anchor]
Meter=String
Text=
X=6R
Y=1
[S1]
Meter=String
MeterStyle=sS
Text=#T1#
FontColor=#C1#
InlineSetting=Color | #K1#
X=2R
Y=0r
LeftMouseUpAction=["#@#dock.exe" "act" "1"]
MouseOverAction=[!SetOption S1 SolidColor "#Rule#,255"][!UpdateMeter S1][!Redraw]
MouseLeaveAction=[!SetOption S1 SolidColor "0,0,0,1"][!UpdateMeter S1][!Redraw]

