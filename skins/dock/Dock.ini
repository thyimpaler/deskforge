[Clock]
Meter=String
MeasureName=mTime
FontFace=#Display#
FontWeight=600
FontSize=13
FontColor=#Ink#
AntiAlias=1
StringAlign=Right
X=(#SCREENAREAWIDTH#-24)
Y=17

[Bat]
Meter=String
MeasureName=mAC
MeasureName2=mBat
FontFace=#Mono#
FontSize=9
FontColor=#Mid#
AntiAlias=1
StringAlign=Right
Text=%1 %2%
X=(#SCREENAREAWIDTH#-150)
Y=22

; ---- volume + brightness (values pushed by dock.exe; scroll to change, click VOL to mute)
[sLv]
Group=V
DynamicVariables=1
FontFace=#Mono#
FontSize=9
FontColor=#Mid#
AntiAlias=1
InlineSetting=Color | #Ink#
InlinePattern=\s(.+)$

[VolHit]
Meter=Image
SolidColor=0,0,0,1
X=(#SCREENAREAWIDTH#-392)
Y=0
W=88
H=56
MouseScrollUpAction=["#@#dock.exe" "vol" "up"]
MouseScrollDownAction=["#@#dock.exe" "vol" "down"]
LeftMouseUpAction=["#@#dock.exe" "vol" "mute"]

[VolTxt]
Meter=String
MeterStyle=sLv
Text=VOL #Vol#
X=(#SCREENAREAWIDTH#-384)
Y=20

[VolTrack]
Meter=Image
SolidColor=#Rule#,255
X=(#SCREENAREAWIDTH#-384)
Y=41
W=72
H=2

; Bars are Image meters with a solid colour and a variable width (min 1), never Shape meters.
[VolBar]
Meter=Image
Group=V
DynamicVariables=1
SolidColor=#Accent#,255
X=(#SCREENAREAWIDTH#-384)
Y=41
W=#VolW#
H=2

[BriHit]
Meter=Image
SolidColor=0,0,0,1
X=(#SCREENAREAWIDTH#-300)
Y=0
W=88
H=56
MouseScrollUpAction=["#@#dock.exe" "bri" "up"]
MouseScrollDownAction=["#@#dock.exe" "bri" "down"]

[BriTxt]
Meter=String
MeterStyle=sLv
Text=BRT #Bri#
X=(#SCREENAREAWIDTH#-292)
Y=20

[BriTrack]
Meter=Image
SolidColor=#Rule#,255
X=(#SCREENAREAWIDTH#-292)
Y=41
W=72
H=2

[BriBar]
Meter=Image
Group=V
DynamicVariables=1
SolidColor=#Accent#,255
X=(#SCREENAREAWIDTH#-292)
Y=41
W=#BriW#
H=2
