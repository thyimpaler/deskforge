[Clock]
Meter=String
MeasureName=mTime
FontFace=Bahnschrift
FontWeight=600
FontSize=13
FontColor=233,233,233
AntiAlias=1
StringAlign=Right
X=1896
Y=17

[Bat]
Meter=String
MeasureName=mAC
MeasureName2=mBat
FontFace=Consolas
FontSize=9
FontColor=110,110,110
AntiAlias=1
StringAlign=Right
Text=%1 %2%
X=1770
Y=22

; ---- volume + brightness (values pushed by dock.exe; scroll to change, click VOL to mute)
[sLv]
Group=V
DynamicVariables=1
FontFace=Consolas
FontSize=9
FontColor=110,110,110
AntiAlias=1
InlineSetting=Color | 233,233,233
InlinePattern=\s(.+)$

[VolHit]
Meter=Shape
X=1528
Y=0
Shape=Rectangle 0,0,88,56 | Fill Color 0,0,0,1 | StrokeWidth 0
MouseScrollUpAction=["#@#dock.exe" "vol" "up"]
MouseScrollDownAction=["#@#dock.exe" "vol" "down"]
LeftMouseUpAction=["#@#dock.exe" "vol" "mute"]

[VolTxt]
Meter=String
MeterStyle=sLv
Text=VOL #Vol#
X=1536
Y=20

[VolTrack]
Meter=Image
SolidColor=46,46,46,255
X=1536
Y=41
W=72
H=2

[VolBar]
Meter=Image
Group=V
DynamicVariables=1
SolidColor=164,22,26,255
X=1536
Y=41
W=#VolW#
H=2

[BriHit]
Meter=Shape
X=1620
Y=0
Shape=Rectangle 0,0,88,56 | Fill Color 0,0,0,1 | StrokeWidth 0
MouseScrollUpAction=["#@#dock.exe" "bri" "up"]
MouseScrollDownAction=["#@#dock.exe" "bri" "down"]

[BriTxt]
