; deskforge live depth ladder: BTCUSDT order book in $10 bins, 10 asks over 10 bids.
; The biggest resting order (the wall) is drawn amber. Fed by @Resources\market.exe every 4s.
; Every bar is an Image meter with a solid colour, right-aligned at x=244. market.exe only changes its
; width and colour through variables. There is no Shape meter here: rewriting Shape geometry on a timer
; is what crashes Rainmeter.
; Starts market.exe itself on refresh (single instance), so Depth works without Tape.
; Placed by the layout. Colours come from the theme (market.exe reads theme.inc).

[Rainmeter]
Update=-1
AccurateText=1
OnRefreshAction=["#@#market.exe"]

[Metadata]
Name=deskforge Live Depth
Author=deskforge contributors
License=MIT

[Variables]
@Include=#@#theme.inc
; per row N: BWN = bar width in px (min 1), BCN = bar colour (r,g,b,a), PN = price label
BW1=1
BC1=0,0,0,0
P1=
