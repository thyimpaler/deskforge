; deskforge alert band: a red band across the top of the screen for a new message on a watched dock app.
; dock.exe writes the text to @Resources\alert.inc and activates (or refreshes) this skin.
; The band wipes in from the left, holds, then the skin removes itself. Click-through, topmost.
; ASCII only. Physical px. Image + String meters only (no Shape meters, no fades).

[Rainmeter]
Update=-1
AccurateText=1
OnRefreshAction=[!FadeDuration 0][!ZPos 2][!ClickThrough 1][!Draggable 0][!KeepOnScreen 0][!Move 0 0][!CommandMeasure mSeq "Execute 1"]

[Metadata]
Name=deskforge Alert
Author=deskforge contributors

[Variables]
ATitle=ALERT
ABody=
BW=1
@Include=#@#alert.inc

[mSeq]
Measure=Plugin
Plugin=ActionTimer
DynamicVariables=1
ActionList1=Wait 30 | Repeat Grow, 22, 8 | Wait 20 | Text | Wait 2600 | Done
Grow=[!SetVariable BW "(Min([#BW]+240,1920))"][!UpdateMeter Band][!Redraw]
Text=[!ShowMeterGroup T][!Redraw]
Done=[!DeactivateConfig "deskforge\Alert"]

[Size]
Meter=Image
SolidColor=0,0,0,1
X=0
Y=0
W=1920
H=72

[Band]
Meter=Image
DynamicVariables=1
SolidColor=164,22,26,255
X=0
Y=0
W=#BW#
H=72

[Idx]
Meter=String
Group=T
Hidden=1
Text=NEW
FontFace=Consolas
FontSize=10
FontColor=255,205,205
AntiAlias=1
X=40
Y=28

[Title]
Meter=String
Group=T
Hidden=1
Text=#ATitle#
FontFace=Bahnschrift
FontWeight=700
FontSize=22
FontColor=255,255,255
AntiAlias=1
X=110
Y=14

[Body]
Meter=String
Group=T
Hidden=1
Text=#ABody#
FontFace=Bahnschrift
FontWeight=600
FontSize=14
FontColor=255,225,225
AntiAlias=1
StringAlign=Right
X=1880
Y=24
