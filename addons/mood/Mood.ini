; deskforge mood: tints the desktop with BTC's rolling 4-hour change.
;   falling  -> red wash rising from the bottom edge   (RISK OFF)
;   flat     -> no tint                                (FLAT, under +/-0.4%)
;   rising   -> cold blue wash                         (RISK ON)
; Strength scales with the size of the move and tops out at 2%.
; Data: Binance public data API, no key, one request a minute.
; Full-screen, behind the other widgets, click-through. One Image meter + one String meter.
; ASCII only. Physical px. No Shape meters.

[Rainmeter]
Update=5000
AccurateText=1
OnRefreshAction=[!FadeDuration 0][!ZPos -2][!ClickThrough 1][!Draggable 0][!KeepOnScreen 0][!Move 0 0]

[Metadata]
Name=deskforge Mood
Author=deskforge contributors

[Variables]
MoodCol=120,120,120
MoodTxt=WAITING
Flat=0.4
Full=2.0
MaxA=85
; set Force to a number (for example -1.8) to preview a mood; 999 means live data
Force=999

[mChg]
Measure=WebParser
URL=https://data-api.binance.vision/api/v3/ticker?symbol=BTCUSDT&windowSize=4h
RegExp=(?siU)"priceChangePercent":"(.*)"
StringIndex=1
UpdateRate=12
Substitute="":"0"

[mVal]
Measure=Calc
DynamicVariables=1
Formula=(#Force# = 999 ? [mChg] : #Force#)
IfCondition=(mVal <= -#Flat#)
IfTrueAction=[!SetVariable MoodCol "164,22,26"][!SetVariable MoodTxt "RISK OFF"][!UpdateMeterGroup M][!Redraw]
IfCondition2=(mVal >= #Flat#)
IfTrueAction2=[!SetVariable MoodCol "70,140,190"][!SetVariable MoodTxt "RISK ON"][!UpdateMeterGroup M][!Redraw]
IfCondition3=(Abs(mVal) < #Flat#)
IfTrueAction3=[!SetVariable MoodCol "120,120,120"][!SetVariable MoodTxt "FLAT"][!UpdateMeterGroup M][!Redraw]

[mA]
Measure=Calc
DynamicVariables=1
Formula=(Abs(mVal) < #Flat# ? 0 : Round(Clamp((Abs(mVal) - #Flat#) / (#Full# - #Flat#), 0.2, 1) * #MaxA#))

[Wash]
Meter=Image
Group=M
DynamicVariables=1
ImageName=#@#mood.png
ImageTint=#MoodCol#,[mA]
X=0
Y=0
W=1920
H=1080
PreserveAspectRatio=0

[Tag]
Meter=String
Group=M
DynamicVariables=1
Text=BTC 4H  [mVal:2]%   #MoodTxt#
FontFace=Consolas
FontSize=9
FontColor=#MoodCol#
AntiAlias=1
X=300
Y=272
