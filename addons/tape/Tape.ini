; deskforge live tape: BTCUSDT 15m candles drawn over the wallpaper's tape band.
; Numbers come from @Resources\market.exe (pushes bangs every 10s). Update=-1: no polling here.
; Every bar is an Image meter with a solid colour. market.exe only changes Y, H and SolidColor through
; variables. There is no Shape meter here: rewriting Shape geometry on a timer is what crashes Rainmeter.
; Box 850x200, placed by the layout. Colours come from the theme (market.exe reads theme.inc). Click-through.

[Rainmeter]
Update=-1
AccurateText=1
OnRefreshAction=["#@#market.exe"]

[Metadata]
Name=deskforge Live Tape
Author=deskforge contributors
License=MIT

[Variables]
@Include=#@#theme.inc
PriceY=-20
Last=
