; deskforge wave: live audio spectrum along the top edge of the dock.
; Reads whatever the speakers are playing (AudioLevel plugin, loopback). Flat when silent.
; 96 Bar meters, mirrored (bass in the middle). Bars grow DOWN from the dock's top rule, inside the dock.
; Click-through and topmost; dock.exe hides and shows it together with the dock.
; Bar meters only: no Shape meters, no dynamic variables. Bar width follows the screen width.

[Rainmeter]
Update=40
OnRefreshAction=[!FadeDuration 0][!ZPos 2][!ClickThrough 1][!Draggable 0][!KeepOnScreen 0]

[Metadata]
Name=deskforge Wave
Author=deskforge contributors
License=MIT

[Variables]
@Include=#@#theme.inc
BW=(#SCREENAREAWIDTH#/96)

[mAudio]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=1024
FFTAttack=30
FFTDecay=160
Bands=48
FreqMin=45
FreqMax=13000
Sensitivity=36

